name: CI

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (DocFuse depuis GitHub, extras dev+gui)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: ruff
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: mypy --strict
        run: mypy --strict src/docia
      - name: pytest
        run: python -m pytest -q

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    permissions:
      contents: write # attacher le zip à la Release (event "release" uniquement)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
          pip install pyinstaller
      - name: Installer Tesseract (OCR embarqué dans Docia.exe)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tessHome = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata" -OutFile "$tessHome\tessdata\fra.traineddata"
          & "$tessHome\tesseract.exe" --version
          & "$tessHome\tesseract.exe" --list-langs
      - name: Build Docia.exe
        env:
          TESSERACT_HOME: C:\Program Files\Tesseract-OCR
        run: pyinstaller --noconfirm Docia.spec
      - name: "Smoke test de l'exe (CLI + doctor — OCR et pdfium embarqués)"
        shell: pwsh  # explicite : le bloc ci-dessous est du PowerShell, pas du cmd
        # PowerShell ne rend que le code de la **dernière** commande : sans ces gardes,
        # `--version`, `init` et `status` pouvaient tous échouer sans faire tomber
        # l'étape, du moment que `doctor` finissait bien. Un exe cassé serait sorti
        # de la CI en vert. Les étapes suivantes faisaient déjà ce contrôle.
        run: |
          dist\Docia.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dist\Docia.exe --config smoke.toml init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dist\Docia.exe --config smoke.toml status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dist\Docia.exe --config smoke.toml doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test de l'exe (extracteurs DocFuse embarqués)
        # Les extracteurs importent leurs bibliothèques paresseusement : seul un vrai
        # .docx/.pdf/.xlsx/.pptx traversé par l'exe prouve que tout est embarqué.
        run: |
          git clone --depth 1 https://github.com/Martossien/DocFuse.git docfuse-src
          dist\Docia.exe --config smoke.toml quick --dry-run docfuse-src\tests\fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test de l'exe (OCR embarqué sur un PDF scanné)
        # Un PDF image-only généré ici (aucun texte natif) : seul l'OCR peut en sortir
        # les mots. On lit le bloc DocFuse produit par l'exe et on exige ces mots.
        shell: pwsh
        run: |
          python scripts/make_scanned_pdf.py smoke-scan\courrier_scanne.pdf "FACTURE SCANNEE NUMERO 4711"
          # Tesseract retiré du PATH : seul le binaire embarqué peut répondre.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Tesseract' }) -join ';'
          dist\Docia.exe --config smoke.toml quick --dry-run --keep-db smoke-scan\ocr.sqlite smoke-scan\courrier_scanne.pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse smoke-scan\ocr.blocks -Filter *.md | ForEach-Object { Write-Host "---- $($_.FullName)"; Get-Content -Encoding utf8 $_.FullName }
          $hits = Get-ChildItem -Recurse smoke-scan\ocr.blocks -Filter *.md | Select-String -Encoding utf8 -Pattern "4711"
          if (-not $hits) { Write-Error "OCR embarqué : le texte du PDF scanné n'a pas été lu"; exit 1 }
          Write-Host "OCR OK :" $hits[0].Line
      - name: Smoke test de l'exe (interface graphique)
        run: dist\Docia.exe --config smoke.toml gui --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Docia-windows-x64
          path: dist/Docia.exe
          if-no-files-found: error
      - name: Attacher le zip à la Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          $zipName = "docia-$version-windows-x64.zip"
          Compress-Archive -Path dist\Docia.exe -DestinationPath $zipName
          Get-FileHash $zipName -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $zipName" } | Set-Content "$zipName.sha256"
          gh release upload "${{ github.event.release.tag_name }}" $zipName "$zipName.sha256" --clobber --repo ${{ github.repository }}
