[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docia"
version = "3.0.0"
description = "Doc-IA analyzer v3 : classification RGPD / finance / sécurité / juridique de partages de fichiers par LLM, à partir d'un scan SMBeagle et de blocs DocFuse"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Martossien" }]
keywords = ["llm", "rgpd", "classification", "smb", "docfuse", "vllm", "open-webui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # DocFuse n'est pas sur PyPI : référence directe vers le dépôt (PEP 508).
    "docfuse @ git+https://github.com/Martossien/DocFuse.git@cf013b3c065a9a32edd0e51ea42c0c8016e4c62f",
    "httpx>=0.27",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
    "ruff==0.16.5",
    "mypy==2.3.1",
]

[project.scripts]
docia = "docia.cli:main"

[project.gui-scripts]
docia-gui = "docia.gui:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docia = ["py.typed", "prompts/*.md", "prompts/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PIE", "PT", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["docia"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "customtkinter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pypdfium2", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
asyncio_mode = "auto"
markers = [
    # Tests qui construisent une vraie fenêtre : ignorés sauf DOCIA_GUI_SCREEN=1.
    # Sur le poste : DISPLAY=:1 DOCIA_GUI_SCREEN=1 python -m pytest tests/test_gui_ecran.py
    "screen: nécessite un écran (voir tests/test_gui_ecran.py)",
]
